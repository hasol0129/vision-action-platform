{% extends 'base.html' %}
{% block title %}로그인{% endblock %}
{% block section %}로그인{% endblock %}
{% block body %}
<main class="auth">
  <div class="card auth-card">
    {% include 'accounts/_auth_side.html' %}
    <form method="post" class="auth-form" novalidate>
      {% csrf_token %}
      <div>
        <h1>로그인</h1>
        <p class="muted" style="margin-top:6px">분석 기록은 로그인한 본인만 볼 수 있습니다.</p>
      </div>
      {% if form.errors %}
        <div class="alert error"><i data-lucide="circle-alert"></i><div>아이디 또는 비밀번호가 올바르지 않습니다.</div></div>
      {% endif %}
      <div class="field">
        <label for="id_username">아이디</label>
        <input class="input" type="text" name="username" id="id_username" value="{{ form.username.value|default:'' }}" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="id_password">비밀번호</label>
        <input class="input" type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn primary" style="height:48px;font-size:15px"><i data-lucide="log-in"></i>로그인</button>
      <p class="muted" style="text-align:center">계정이 없나요? <a href="{% url 'signup' %}">회원가입</a></p>
    </form>
  </div>
</main>
{% endblock %}
